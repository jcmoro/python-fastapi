apiVersion: v1
kind: Secret
metadata:
  name: catalog-db
  namespace: catalog
stringData:
  POSTGRES_USER: <user>
  POSTGRES_PASSWORD: <password>
  POSTGRES_DB: catalog
  DATABASE_URL: postgresql+asyncpg://<user>:<password>@db:5432/catalog
---
apiVersion: v1
kind: Secret
metadata:
  name: assistant-llm
  namespace: catalog
stringData:
  ANTHROPIC_API_KEY: <key>
